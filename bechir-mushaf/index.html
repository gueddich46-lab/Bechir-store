<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a32"><title>مصحف بشير</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e4d6;color:#19382f;font-family:system-ui,"Noto Naskh Arabic",sans-serif}button,select{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.bar{background:#123a32;color:#fff;display:flex;align-items:center;justify-content:space-around;gap:8px;padding:6px 10px;min-height:48px;flex-shrink:0}.bar button,.bar select{color:white;border:1px solid #8fa99e;border-radius:8px;padding:6px;background:#205247}.bar select{max-width:130px}.viewer{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative;overflow:auto;touch-action:pan-y}.page{width:100%;height:100%;object-fit:contain;display:none}.notice{max-width:460px;margin:12px;padding:25px;border:4px double #a58b4d;background:#fffdf3;text-align:center;line-height:1.9}.notice h1{font-size:24px;color:#205247}.notice p{font-size:15px}.hide .bar{display:none}.hide .viewer{height:100dvh}.toggle{position:absolute;top:8px;left:8px;background:#123a32d9;color:#fff;padding:6px 10px;border-radius:30px;z-index:3;font-size:12px}.status{font-size:12px;opacity:.9}.nav{display:flex;gap:4px}audio{display:none}@media(max-width:380px){.bar{font-size:12px}.bar button{padding:5px}.notice{padding:14px}}</style></head>
<body><div id="app">
<header class="bar"><button id="indexBtn">☰ الفهرس</button><span id="surah">مصحف بشير</span><span id="counter">— / ٦٠٤</span></header>
<main class="viewer" id="viewer"><button class="toggle" id="toggle">⛶ إخفاء الأشرطة</button><img id="pageImage" class="page" alt="صفحة المصحف الأصلية"><section class="notice" id="notice"><h1>مصحف بشير</h1><p>مصحف ملون برواية حفص عن عاصم</p><p>هذه واجهة القراءة الأولية. لم تُضمَّن صفحات القرآن بعد؛ ننتظر اعتماد نسخة أصلية ملونة موثوقة ومصرح باستخدامها حتى لا نعرض نصًا قرآنيًا غير محقق.</p><p class="status">القراءة دون إنترنت ستتوفر بعد تضمين صفحات المصحف المعتمدة.</p></section></main>
<footer class="bar"><div class="nav"><button id="prev" aria-label="الصفحة السابقة">❯</button><button id="next" aria-label="الصفحة التالية">❮</button></div><button id="bookmark">☆ حفظ</button><select id="reader" aria-label="القارئ"><option value="">اختر القارئ</option><option>مشاري العفاسي</option><option>ماهر المعيقلي</option><option>عبد الباسط عبد الصمد</option><option>محمد صديق المنشاوي</option><option>محمود خليل الحصري</option><option>عبد الرحمن السديس</option></select><button id="play">▷ استماع</button></footer>
</div>
<script>
const app=document.getElementById('app'),toggle=document.getElementById('toggle'),counter=document.getElementById('counter');
let page=Number(localStorage.getItem('bechirMushafPage')||1);
function render(){counter.textContent=page.toLocaleString('ar')+' / ٦٠٤';localStorage.setItem('bechirMushafPage',page);document.getElementById('bookmark').textContent=localStorage.getItem('bechirMushafBookmark')==page?'★ محفوظ':'☆ حفظ'}
document.getElementById('prev').onclick=()=>{page=Math.max(1,page-1);render()};
document.getElementById('next').onclick=()=>{page=Math.min(604,page+1);render()};
document.getElementById('bookmark').onclick=()=>{localStorage.setItem('bechirMushafBookmark',page);render()};
toggle.onclick=()=>{app.classList.toggle('hide');toggle.textContent=app.classList.contains('hide')?'⛶ إظهار الأشرطة':'⛶ إخفاء الأشرطة'};
document.getElementById('indexBtn').onclick=()=>{const v=prompt('أدخل رقم الصفحة (١ إلى ٦٠٤):',page);if(v===null)return;const n=Number(v.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776));if(Number.isInteger(n)&&n>=1&&n<=604){page=n;render()}else alert('رقم الصفحة غير صحيح')};
document.getElementById('play').onclick=()=>alert('التلاوات ستُفعّل بعد التحقق من مصادر التسجيلات وحقوق استخدامها.');
let startX=0;document.getElementById('viewer').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});document.getElementById('viewer').addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>70){page=Math.min(604,Math.max(1,page+(delta>0?1:-1)));render()}},{passive:true});render();
</script></body></html>
