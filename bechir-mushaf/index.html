<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a32"><title>مصحف بشير</title><link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e4d6;color:#19382f;font-family:system-ui,"Noto Naskh Arabic",sans-serif}button,select{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit}#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.bar{background:#123a32;color:#fff;display:flex;align-items:center;justify-content:space-around;gap:8px;padding:6px 10px;min-height:48px;flex-shrink:0}.bar button,.bar select{color:white;border:1px solid #8fa99e;border-radius:8px;padding:6px;background:#205247}.bar select{max-width:100%;min-width:0}.bar>*{min-width:0}.bar button{white-space:nowrap}.bar{width:100%;max-width:100vw}.bar footer{max-width:100vw}footer.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"nav reader play save" "surah surah surah download";gap:5px;padding:5px 7px;min-height:0}footer .nav{grid-area:nav}footer #reader{grid-area:reader;width:100%}footer #play{grid-area:play}footer #bookmark{grid-area:save}footer #surahAudio{grid-area:surah;width:100%}footer #download{grid-area:download}footer .nav button{padding:6px 8px}footer button,footer select{font-size:clamp(11px,3.2vw,15px);padding:6px 5px;max-width:100%}header.bar{justify-content:space-between}header.bar #surah{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative;overflow:auto;touch-action:pan-y}.page{width:100%;height:100%;object-fit:contain;display:none}.notice{max-width:460px;max-height:calc(100% - 24px);overflow:auto;margin:12px;padding:16px;border:4px double #a58b4d;background:#fffdf3;text-align:center;line-height:1.9}.notice h1{font-size:24px;color:#205247}.notice p{font-size:15px}.hide .bar{display:none}.hide .viewer{height:100dvh}.toggle{position:absolute;top:8px;left:8px;background:#123a32d9;color:#fff;padding:6px 10px;border-radius:30px;z-index:3;font-size:12px}.status{font-size:12px;opacity:.9}.nav{display:flex;gap:4px}audio{display:none}@media(max-width:380px){.bar{font-size:12px}.bar button{padding:5px}.notice{padding:14px}}</style></head>
<body><div id="app">
<header class="bar"><button id="indexBtn">☰ الفهرس</button><span id="surah">مصحف بشير</span><span id="counter">— / ٦٠٤</span></header>
<main class="viewer" id="viewer"><button class="toggle" id="toggle">⛶ إخفاء الأشرطة</button><img id="pageImage" class="page" alt="صفحة المصحف الأصلية"><section class="notice" id="notice"><h1>مصحف بشير</h1><p>مصحف ملون برواية حفص عن عاصم</p><p>تعذر تحميل صفحة المصحف. تحقق من الاتصال بالإنترنت. تعرض هذه النسخة صفحات مصحف التجويد من نفس المصدر المستخدم في تطبيق نور القلب.</p><p class="status">الصفحات تُحمّل حاليًا عبر الإنترنت؛ إتاحتها كاملة دون إنترنت داخل APK تحتاج التحقق من الترخيص وتضمين الملفات.</p></section></main>
<footer class="bar"><div class="nav"><button id="prev" aria-label="الصفحة السابقة">❯</button><button id="next" aria-label="الصفحة التالية">❮</button></div><button id="bookmark">☆ حفظ</button><select id="reader" aria-label="القارئ"><option value="">اختر القارئ</option><option>مشاري العفاسي</option><option>ماهر المعيقلي</option><option>عبد الباسط عبد الصمد</option><option>محمد صديق المنشاوي</option><option>محمود خليل الحصري</option><option>عبد الرحمن السديس</option></select><select id="surahAudio" aria-label="السورة"><option value="1">الفاتحة</option></select><button id="play">▷ استماع</button><button id="download" title="تنزيل التلاوة">⬇</button><audio id="audio" controls preload="none"></audio></footer>
</div>
<script>
const mushafSource='https://raw.githubusercontent.com/ahmedabdalharith/Quran-Mushaf-Data/main/data/images/hafs-tajweed/';const app=document.getElementById('app'),toggle=document.getElementById('toggle'),counter=document.getElementById('counter');
let page=Number(localStorage.getItem('bechirMushafPage')||1);
function render(){const image=document.getElementById('pageImage');image.onload=()=>{image.style.display='block';document.getElementById('notice').style.display='none'};image.onerror=()=>{image.style.display='none';document.getElementById('notice').style.display='block'};image.src=mushafSource+String(page).padStart(3,'0')+'.webp';counter.textContent=page.toLocaleString('ar')+' / ٦٠٤';localStorage.setItem('bechirMushafPage',page);document.getElementById('bookmark').textContent=localStorage.getItem('bechirMushafBookmark')==page?'★ محفوظ':'☆ حفظ'}
document.getElementById('prev').onclick=()=>{page=Math.max(1,page-1);render()};
document.getElementById('next').onclick=()=>{page=Math.min(604,page+1);render()};
document.getElementById('bookmark').onclick=()=>{localStorage.setItem('bechirMushafBookmark',page);render()};
toggle.onclick=()=>{app.classList.toggle('hide');toggle.textContent=app.classList.contains('hide')?'⛶ إظهار الأشرطة':'⛶ إخفاء الأشرطة'};
document.getElementById('indexBtn').onclick=()=>{const v=prompt('أدخل رقم الصفحة (١ إلى ٦٠٤):',page);if(v===null)return;const n=Number(v.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776));if(Number.isInteger(n)&&n>=1&&n<=604){page=n;render()}else alert('رقم الصفحة غير صحيح')};
const SURAHS=['الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام','الأعراف','الأنفال','التوبة','يونس','هود','يوسف','الرعد','إبراهيم','الحجر','النحل','الإسراء','الكهف','مريم','طه','الأنبياء','الحج','المؤمنون','النور','الفرقان','الشعراء','النمل','القصص','العنكبوت','الروم','لقمان','السجدة','الأحزاب','سبأ','فاطر','يس','الصافات','ص','الزمر','غافر','فصلت','الشورى','الزخرف','الدخان','الجاثية','الأحقاف','محمد','الفتح','الحجرات','ق','الذاريات','الطور','النجم','القمر','الرحمن','الواقعة','الحديد','المجادلة','الحشر','الممتحنة','الصف','الجمعة','المنافقون','التغابن','الطلاق','التحريم','الملك','القلم','الحاقة','المعارج','نوح','الجن','المزمل','المدثر','القيامة','الإنسان','المرسلات','النبأ','النازعات','عبس','التكوير','الانفطار','المطففين','الانشقاق','البروج','الطارق','الأعلى','الغاشية','الفجر','البلد','الشمس','الليل','الضحى','الشرح','التين','العلق','القدر','البينة','الزلزلة','العاديات','القارعة','التكاثر','العصر','الهمزة','الفيل','قريش','الماعون','الكوثر','الكافرون','النصر','المسد','الإخلاص','الفلق','الناس'];
const audio=document.getElementById('audio'),reader=document.getElementById('reader'),surahAudio=document.getElementById('surahAudio'),play=document.getElementById('play');
surahAudio.innerHTML=SURAHS.map((n,i)=>'<option value="'+(i+1)+'">'+n+'</option>').join('');
reader.innerHTML='<option value="">جارٍ تحميل القراء…</option>';
let reciters=[];
async function loadReciters(){try{const response=await fetch('https://mp3quran.net/api/v3/reciters?language=ar');if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();const names=['مشاري العفاسي','ماهر المعيقلي','عبدالباسط عبدالصمد','محمد صديق المنشاوي','محمود خليل الحصري','عبدالرحمن السديس','سعد الغامدي','ياسر الدوسري','فارس عباد','أبو بكر الشاطري'];reciters=data.reciters.flatMap(r=>(r.moshaf||[]).filter(m=>/حفص|Hafs/i.test(m.name||'')&&m.server).map(m=>({name:r.name,moshaf:m}))).filter(r=>names.some(n=>r.name.replace(/\\s/g,'').includes(n.replace(/\\s/g,'').slice(0,7))));if(!reciters.length)throw Error('No compatible reciters');reader.innerHTML='<option value="">اختر القارئ</option>'+reciters.map((r,i)=>'<option value="'+i+'">'+r.name+' — '+r.moshaf.name+'</option>').join('');}catch(e){reader.innerHTML='<option value="">القراء غير متاحين دون إنترنت</option>';}}
function audioUrl(){const r=reciters[Number(reader.value)];if(reader.value===''||!r)return null;const num=Number(surahAudio.value);const available=(r.moshaf.surah_list||'').split(',').map(Number);if(available.length&&available[0]&& !available.includes(num))return null;return r.moshaf.server.replace(/\\/?$/,'/')+String(num).padStart(3,'0')+'.mp3'}
play.onclick=async()=>{if(!audio.paused){audio.pause();return}const url=audioUrl();if(!url){alert('اختر قارئًا وسورة متاحة أولًا');return}if(audio.src!==url)audio.src=url;try{await audio.play()}catch(e){alert('تعذر تشغيل التلاوة. تحقق من الاتصال بالإنترنت.')}};
audio.onplay=()=>play.textContent='Ⅱ إيقاف';audio.onpause=()=>play.textContent='▷ استماع';reader.onchange=surahAudio.onchange=()=>{audio.pause();audio.removeAttribute('src');audio.load()};
document.getElementById('download').onclick=()=>{const url=audioUrl();if(!url){alert('اختر القارئ والسورة أولًا');return}const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();alert('سيُفتح ملف التلاوة في المتصفح. الحفظ داخل التطبيق للاستماع دون إنترنت لم يُفعّل بعد.')};
loadReciters();
let startX=0;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){page=Math.max(1,page-1);render()}if(e.key==='ArrowLeft'){page=Math.min(604,page+1);render()}});document.getElementById('viewer').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});document.getElementById('viewer').addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>70){page=Math.min(604,Math.max(1,page+(delta>0?1:-1)));render()}},{passive:true});render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
