name: Build Bechir Mushaf APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'bechir-mushaf-android/**'
      - '.github/workflows/build-bechir-mushaf.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: bechir-mushaf-android
      - uses: actions/upload-artifact@v4
        with:
          name: Bechir-Mushaf-APK-test
          path: bechir-mushaf-android/app/build/outputs/apk/debug/app-debug.apk
