name: Build Bechir Mushaf APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'bechir-mushaf-android/**'
      - '.github/workflows/build-bechir-mushaf.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Render approved gold Arabic app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-core
          mkdir -p bechir-mushaf-android/app/src/main/res/drawable-nodpi
          rsvg-convert -w 432 -h 432 bechir-mushaf-android/icon-source.svg -o bechir-mushaf-android/app/src/main/res/drawable-nodpi/app_icon.png
      - name: Bundle and validate all 604 Mushaf pages for offline reading
        run: python3 bechir-mushaf-android/scripts/prepare_offline.py
      - name: Build Android debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
        working-directory: bechir-mushaf-android
      - uses: actions/upload-artifact@v4
        with:
          name: Bechir-Mushaf-APK-test
          path: bechir-mushaf-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish offline APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=bechir-mushaf-android/app/build/outputs/apk/debug/app-debug.apk
          TAG=bechir-mushaf-offline-v1.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#Bechir-Mushaf-offline.apk" --clobber
          else
            gh release create "$TAG" "$APK#Bechir-Mushaf-offline.apk" --title "مصحف بشير — نسخة القراءة دون إنترنت 1.1" --notes "نسخة اختبارية تضم صفحات المصحف الـ604 للقراءة دون اتصال. يرجى اختبارها في وضع الطيران."
          fi
