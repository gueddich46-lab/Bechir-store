name: Build BECHIR MONEY APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'bechir-money/android/**'
      - '.github/workflows/build-bechir-money-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: bechir-money/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BECHIR-MONEY-debug-APK
          path: bechir-money/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK as downloadable GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp bechir-money/android/app/build/outputs/apk/debug/app-debug.apk BECHIR-MONEY.apk
          if gh release view bechir-money-test-v1 >/dev/null 2>&1; then
            gh release upload bechir-money-test-v1 BECHIR-MONEY.apk --clobber
          else
            gh release create bechir-money-test-v1 BECHIR-MONEY.apk --title "BECHIR MONEY — نسخة تجريبية" --notes "APK تجريبي غير موقّع بمفتاح إصدار نهائي. يعتمد على الموقع للتحميل الأول ويتطلب اختبار تسجيل الدخول والمزامنة." --prerelease
          fi
