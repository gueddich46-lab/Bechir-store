name: Build BECHIR MONEY APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'bechir-money/android/**'
      - '.github/workflows/build-bechir-money-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: bechir-money/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BECHIR-MONEY-debug-APK
          path: bechir-money/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
