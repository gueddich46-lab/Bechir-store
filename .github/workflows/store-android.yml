name: Build BECHIR STORE Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/store-android.yml'
      - 'android-launcher.svg'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android wrapper
        run: |
          mkdir -p android/app/src/main/java/com/bechir/store android/app/src/main/res/drawable-nodpi
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'BechirStore'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.bechir.store'
            compileSdk 35
            defaultConfig {
              applicationId 'com.bechir.store'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="BECHIR STORE" android:icon="@drawable/store_launcher" android:roundIcon="@drawable/store_launcher" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/com/bechir/store/MainActivity.java <<'EOF'
          package com.bechir.store;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.DownloadListener;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            private WebView web;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              web.getSettings().setJavaScriptEnabled(true);
              web.getSettings().setDomStorageEnabled(true);
              web.getSettings().setAllowFileAccess(false);
              web.getSettings().setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              web.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, String url) {
                  if(url.startsWith("https://gueddich46-lab.github.io/Bechir-store/")) return false;
                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  return true;
                }
              });
              web.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
              });
              web.setWebChromeClient(new WebChromeClient());
              setContentView(web);
              web.loadUrl("https://gueddich46-lab.github.io/Bechir-store/");
            }
            @Override public void onBackPressed() {
              if(web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - name: Render identical purple B launcher icon
        run: |
          python3 -m pip install --user cairosvg
          python3 -c "import cairosvg; cairosvg.svg2png(url='android-launcher.svg',write_to='android/app/src/main/res/drawable-nodpi/store_launcher.png',output_width=432,output_height=432)"
      - name: Build installable APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish APK to downloads
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/bechir-store.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/bechir-store.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish BECHIR STORE Android APK"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BECHIR-STORE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
